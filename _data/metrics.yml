# Only numbers that are NOT derivable from this repo live here.
#
# The CVE count is deliberately absent: it is computed in section-metrics.html
# as `site.cves | size`, so it can never disagree with the CVE list. Putting it
# here too would reintroduce exactly the drift the collection design avoids.
#
# CONFIRM THESE TWO — they are derived from the CTF_writeups repo, not supplied:
#   700  = ~710 markdown files carrying frontmatter, minus index/hub pages
#   141  = HackTheBox 29 + TryHackMe 112 writeups not marked `status: incomplete`
# Anything not confirmed should be deleted rather than estimated.

- label: CTF writeups published
  value: 700
  suffix: "+"
  icon: bi-journal-code

- label: Lab machines rooted
  value: 141
  suffix: ""
  icon: bi-terminal

