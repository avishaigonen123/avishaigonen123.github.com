# Numbers shown in the hero strip. The CVE count is NOT here: it is computed in
# section-metrics.html as `site.cves | size`, so it can never disagree with the
# CVE list.
#
# `url` makes the whole tile a link. A value starting with "#" is treated as an
# in-page anchor and left as-is; anything else goes through relative_url.
# `prefix` renders before the number, `suffix` after it.
#
# 661 is not an estimate. The CTF site's own counter reports it, and the two
# must agree. It counts every page under a known platform directory, excluding
# each platform's own hub index and excluding anything marked `status:
# incomplete`: 687 pages exist, 26 are incomplete.
#
# The counter previously said 579. It listed only 12 of the 15 platforms,
# omitted websec.il entirely, and skipped every writeup stored as
# <name>/index.md - which is how android_hacking, websec.il and several
# sub-wargames are organised.

- label: CTF writeups published
  value: 661
  prefix: ""
  suffix: ""
  url: https://avishaigonen123.github.io/CTF_writeups/
  icon: bi-journal-code

- label: Earned in bug bounties
  value: 5000
  prefix: "$"
  suffix: "+"
  url: "#bounty"
  icon: bi-trophy
