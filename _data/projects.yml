# Descriptions for the personal repos come from their own GitHub descriptions.
# mcp_binder is a Pluto Security org repo; its description is quoted verbatim.

- name: MCP Binder
  url: https://github.com/plutosecurity/mcp_binder
  lang: JavaScript
  icon: bi-bug
  desc: >-
    Research framework for turning MCP DNS rebinding into a live attack lab.
    Scans local MCP servers from a Chrome extension, drives a real DNS rebinding
    attack through your own VM and DNS zone, captures the MCP session, and
    operates it from a token-protected dashboard.
  tags: [mcp, dns-rebinding, research-tooling]

- name: Time Side-Channel Attack
  url: https://github.com/avishaigonen123/Time-side-channel-attack
  lang: C++
  icon: bi-stopwatch
  desc: >-
    Academic project implementing time side-channel attacks: password-verification
    timing, defeating artificial random delays with statistics, and ECDSA key
    extraction. Runs against ESP32 and Arduino hardware, with a written report.
  tags: [side-channel, crypto, embedded]

- name: WordPress Vulnerability Lab
  url: https://github.com/avishaigonen123/WordPress-vuln-lab
  lang: Python
  icon: bi-box-seam
  desc: >-
    A Docker-based lab for standing up WordPress with arbitrary plugin sets and
    versions, so vulnerability research can be reproduced locally against a
    target you control.
  tags: [lab, docker, web]

