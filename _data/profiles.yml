# Handles and profile URLs are from Avishai directly. Stats are omitted rather
# than estimated.
#
# HOW TO ADD A LOGO
#   Drop the file in  assets/img/profiles/  then set:
#     image: /assets/img/profiles/hackerone.png
#   It renders as a small square logo beside the platform name on the card.
#   Transparent PNG or SVG works best; roughly square, 64px or larger.
#
# HOW TO EMBED YOUR LIVE PROFILE (optional)
#   Set:
#     embed: https://hackerone.com/avishaigonen
#   The card then renders it in an iframe with a fixed height. Be aware that
#   these platforms send X-Frame-Options / CSP frame-ancestors headers which
#   block framing, so the iframe is likely to stay blank. Leave `embed` unset
#   and the card shows a normal link instead, which always works.
#
# HOW TO ADD STATS
#   stats:
#     - ["Reputation", "1,234"]
#     - ["Reports resolved", "12"]

